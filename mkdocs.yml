site_name: KhaledLab
site_description: Research in Graph Mining, Hypergraph Learning, and Network Medicine
site_url: https://YOUR-USER.github.io/lab-site/

nav:
  - Home: index.md
  - People: people.md
  - Opportunities: opportunities.md
  - Publications: publications.md
  - Projects: projects.md
  - Teaching: teaching.md
  
theme:
  name: material
  language: en 
  features:
  - navigation.tabs
  - content.code.copy
  - content.tabs.link
  - search.highlight
  - search.suggest
  - toc.integrate
  palette:
  - scheme: default
    primary: indigo
    accent: deep purple
  - scheme: slate
    primary: indigo
    accent: deep purple
  hide:
    - site_name
  

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:materialx.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/extra.js
use_directory_urls: true
docs_dir: docs
extra:
  social:
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=XXXX
      name: Google Scholar
    - icon: fontawesome/brands/github
      link: https://github.com/YOUR-USER
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/YOUR-LINK
      name: LinkedIn

copyright: "Copyright &copy; 2025 KhaledLab <br>
We are part of the School of Computing at Southern Illinois University Carbondale. 
"
